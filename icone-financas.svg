<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4"/>
      <stop offset="50%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#0052CC"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#10B981"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fundo circular -->
  <circle cx="128" cy="128" r="120" fill="#F9FAFB" filter="url(#shadow)"/>
  
  <!-- Nuvem -->
  <path filter="url(#shadow)" fill="url(#cloudGrad)" 
        d="M 180 140 Q 210 140 210 110 Q 210 80 180 80 Q 180 40 140 40 Q 120 20 90 30 Q 60 20 50 50 Q 30 55 30 80 Q 30 120 60 120 Z"/>
  
  <!-- Gráfico de barras ascendente -->
  <rect x="70" y="100" width="20" height="30" fill="url(#chartGrad)" rx="2"/>
  <rect x="100" y="85" width="20" height="45" fill="url(#chartGrad)" rx="2"/>
  <rect x="130" y="70" width="20" height="60" fill="url(#chartGrad)" rx="2"/>
  
  <!-- Símbolo de cifrão -->
  <circle cx="165" cy="95" r="18" fill="#FCD34D" opacity="0.9"/>
  <text x="165" y="102" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#F59E0B" text-anchor="middle">$</text>
</svg>